name: file-syncer

services:
  server:
    container_name: middleman_server
    image: docker.io/rust/rust:slim-trixie
    ports:
      # Assigns localhost port 80 to 8080 on the container
      - "127.0.0.1:80:${SERVER_PORT:-8080}"
    volumes:
      - server:/server
    healthcheck:
      # Healthcheck on the server
      test: ["CMD", "curl -f $IP_ADD/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      PORT: ${SERVER_PORT:-8080}
      IP_ADD: ${IP_ADD:-https://localhost:${SERVER_PORT}:-8080}

    mem_limit: ${MAX_MEM:-5}g
    networks:
      - default
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-previligies:true

networks:
  default:
    internal: true

volumes:
  server:
